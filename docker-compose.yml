services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smartdroneinspection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdroneinspection}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartdroneinspection-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smartdroneinspection-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: smartdroneinspection-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - smartdroneinspection-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smartdroneinspection-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdroneinspection-backend:latest
    container_name: smartdroneinspection-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartdroneinspection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-inspection-evidence}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-local_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_dev_only_change_me}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:-}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80}
      AUTH_BOOTSTRAP_ENABLED: ${AUTH_BOOTSTRAP_ENABLED:-false}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_BOOTSTRAP_FULL_NAME: ${AUTH_BOOTSTRAP_FULL_NAME:-Admin}
      REPORT_NARRATIVE_MAX_CHARS: ${REPORT_NARRATIVE_MAX_CHARS:-10000}
      REPORT_DRAFT_ENABLED: ${REPORT_DRAFT_ENABLED:-false}
      REPORT_DRAFT_BASE_URL: ${REPORT_DRAFT_BASE_URL:-}
      REPORT_DRAFT_API_KEY: ${REPORT_DRAFT_API_KEY:-}
      REPORT_DRAFT_MODEL: ${REPORT_DRAFT_MODEL:-}
      REPORT_DRAFT_TIMEOUT: ${REPORT_DRAFT_TIMEOUT:-60s}
      YOLO_INFERENCE_ENABLED: ${YOLO_INFERENCE_ENABLED:-false}
      YOLO_INFERENCE_BASE_URL: ${YOLO_INFERENCE_BASE_URL:-http://localhost:8000}
      YOLO_INFERENCE_PREDICT_PATH: ${YOLO_INFERENCE_PREDICT_PATH:-/predict}
      YOLO_INFERENCE_CONNECT_TIMEOUT: ${YOLO_INFERENCE_CONNECT_TIMEOUT:-2s}
      YOLO_INFERENCE_READ_TIMEOUT: ${YOLO_INFERENCE_READ_TIMEOUT:-30s}
      COMPATIBLE_VISION_ENABLED: ${COMPATIBLE_VISION_ENABLED:-false}
      COMPATIBLE_VISION_BASE_URL: ${COMPATIBLE_VISION_BASE_URL:-${REPORT_DRAFT_BASE_URL:-}}
      COMPATIBLE_VISION_MODEL: ${COMPATIBLE_VISION_MODEL:-${REPORT_DRAFT_MODEL:-}}
      COMPATIBLE_VISION_API_KEY: ${COMPATIBLE_VISION_API_KEY:-${REPORT_DRAFT_API_KEY:-}}
      COMPATIBLE_VISION_TIMEOUT: ${COMPATIBLE_VISION_TIMEOUT:-${REPORT_DRAFT_TIMEOUT:-60s}}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_BIND:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    networks:
      - smartdroneinspection-network

  web:
    build:
      context: ../SmartDroneInspection-frontend
      dockerfile: Dockerfile
    image: smartdroneinspection-web:latest
    container_name: smartdroneinspection-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartdroneinspection-network

networks:
  smartdroneinspection-network:
    driver: bridge

volumes:
  smartdroneinspection-postgres-data:
  smartdroneinspection-minio-data:
