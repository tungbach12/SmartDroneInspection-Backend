name: CI

# Manual dispatch while GitHub-hosted Actions runners are billing-locked on the account.
# Run `./mvnw verify` (or `.\verify-local.ps1` on Windows) locally before opening or
# merging PRs. When billing is restored, add `push`/`pull_request` triggers back and
# keep this verify job unchanged.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (Spotless + tests + JaCoCo + Modulith checks)
        run: ./mvnw -B verify
