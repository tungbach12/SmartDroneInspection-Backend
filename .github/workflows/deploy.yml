name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS2 (smartdroneinspection.duckdns.org)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci
          ping: 100.120.66.114

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.120.66.114 >> ~/.ssh/known_hosts

      - name: Deploy backend + web (docker compose)
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            set -e
            cd ~/repos/backend
            git fetch --depth 1 origin main
            git reset --hard origin/main
            # Sync frontend repo that the BE compose build references (../SmartDroneInspection-frontend)
            cd ~/repos/frontend
            git fetch --depth 1 origin main || true
            git reset --hard origin/main || true
            cd ~/repos/backend
            # Dump before touching anything: migrations V24-V26 are a destructive schema reset
            # (legacy marketplace tables are dropped, roles are rewritten) and there is no
            # down-migration. If the deploy fails, this is the only way back.
            mkdir -p ~/db_backups
            if docker ps --format '{{.Names}}' | grep -qx smartdroneinspection-postgres; then
              docker exec smartdroneinspection-postgres pg_dump -U postgres smartdroneinspection \
                > ~/db_backups/pre-deploy-$(date -u +%Y%m%d-%H%M%S).sql \
                && echo "Pre-deploy database backup written to ~/db_backups"
            fi
            # A plain `compose down` leaves containers behind when they were created by a
            # previous compose project (the project name is derived from the directory and
            # can change), which then makes `compose up` fail with
            # "container name is already in use". Remove the named containers and the
            # project network explicitly so every deploy starts from a known state.
            docker compose down --remove-orphans || true
            docker rm -f smartdroneinspection-web smartdroneinspection-backend smartdroneinspection-postgres smartdroneinspection-minio 2>/dev/null || true
            docker network rm backend_smartdroneinspection-network 2>/dev/null || true
            docker compose up -d --build
            docker image prune -f
            echo "Deployed at $(date -u +%FT%TZ)"
          '

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            # The backend now runs Flyway V24-V26 on boot, which takes longer than a fixed
            # sleep on a cold container. Poll the health endpoint instead of guessing.
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:18081/actuator/health >/dev/null 2>&1; then
                echo "Backend healthy after ${i}0s"
                break
              fi
              sleep 10
            done
            curl -fsS -o /dev/null -w "web HTTP %{http_code}\n" http://127.0.0.1:18080/
            curl -fsS http://127.0.0.1:18081/actuator/health | head -c 200; echo
          '
