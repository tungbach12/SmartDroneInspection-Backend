spring:
  application:
    name: smartdroneinspection
  mail:
    host: ${AUTH_OTP_SMTP_HOST:}
    port: ${AUTH_OTP_SMTP_PORT:587}
    username: ${AUTH_OTP_SMTP_USERNAME:}
    password: ${AUTH_OTP_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${AUTH_OTP_SMTP_AUTH:true}
          starttls:
            enable: ${AUTH_OTP_SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:500MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:510MB}
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartdroneinspection}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,hikari
  endpoint:
    health:
      show-details: when-authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  payment:
    payos:
      enabled: ${PAYOS_ENABLED:false}
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      return-url: ${PAYOS_RETURN_URL:http://localhost:5173/client/reports/{inspectionId}}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/client/reports/{inspectionId}}
      connect-timeout: ${PAYOS_CONNECT_TIMEOUT:5s}
      read-timeout: ${PAYOS_READ_TIMEOUT:15s}
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/webhooks/vnpay/return}
      frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:3000/client/inspections/{inspectionId}/report}
      version: ${VNPAY_VERSION:2.1.0}
      command: ${VNPAY_COMMAND:pay}
      order-type: ${VNPAY_ORDER_TYPE:other}
      curr-code: ${VNPAY_CURR_CODE:VND}
      locale: ${VNPAY_LOCALE:vn}
      expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  evidence:
    max-file-size: ${EVIDENCE_MAX_FILE_SIZE:500MB}
  assets:
    drone-document-max-file-size: ${DRONE_DOCUMENT_MAX_FILE_SIZE:10MB}
    document-max-file-size: ${ASSET_DOCUMENT_MAX_FILE_SIZE:10MB}
  workforce:
    # Display warning horizon for a credential approaching its recorded expiry date. Not a
    # statutory renewal rule; change it per deployment if the organization warns earlier or later.
    # Chosen for commercial drone inspection, where operator credentials and liability insurance
    # are annual or longer: two months is enough to arrange renewal and internal review.
    credential-expiring-soon-window: ${CREDENTIAL_EXPIRING_SOON_WINDOW:60d}
  report:
    narrative-max-chars: ${REPORT_NARRATIVE_MAX_CHARS:10000}
  storage:
    minio:
      enabled: ${MINIO_ENABLED:true}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${MINIO_BUCKET:inspection-evidence}
      access-key: ${MINIO_ACCESS_KEY:local_minio_admin}
      secret-key: ${MINIO_SECRET_KEY:local_dev_only_change_me}
  ai:
    yolo:
      enabled: ${YOLO_INFERENCE_ENABLED:false}
      base-url: ${YOLO_INFERENCE_BASE_URL:http://localhost:8000}
      predict-path: ${YOLO_INFERENCE_PREDICT_PATH:/predict}
      connect-timeout: ${YOLO_INFERENCE_CONNECT_TIMEOUT:2s}
      read-timeout: ${YOLO_INFERENCE_READ_TIMEOUT:30s}
    compatible-vision:
      enabled: ${COMPATIBLE_VISION_ENABLED:${REPORT_DRAFT_ENABLED:false}}
      base-url: ${COMPATIBLE_VISION_BASE_URL:${REPORT_DRAFT_BASE_URL:}}
      model: ${COMPATIBLE_VISION_MODEL:${REPORT_DRAFT_MODEL:}}
      api-key: ${COMPATIBLE_VISION_API_KEY:${REPORT_DRAFT_API_KEY:}}
      timeout: ${COMPATIBLE_VISION_TIMEOUT:${REPORT_DRAFT_TIMEOUT:60s}}
  smartdronehub:
    base-url: ${SMARTDRONEHUB_BASE_URL:http://localhost:8090}
    connect-timeout: ${SMARTDRONEHUB_CONNECT_TIMEOUT:5s}
    read-timeout: ${SMARTDRONEHUB_READ_TIMEOUT:60s}
  report-draft:
    enabled: ${REPORT_DRAFT_ENABLED:false}
    base-url: ${REPORT_DRAFT_BASE_URL:http://localhost:11434}
    api-key: ${REPORT_DRAFT_API_KEY:}
    model: ${REPORT_DRAFT_MODEL:llama3}
    timeout: ${REPORT_DRAFT_TIMEOUT:60s}
  maintenance-advisor:
    enabled: ${MAINTENANCE_ADVISOR_ENABLED:false}
    base-url: ${MAINTENANCE_ADVISOR_BASE_URL:${REPORT_DRAFT_BASE_URL:http://localhost:11434}}
    api-key: ${MAINTENANCE_ADVISOR_API_KEY:${REPORT_DRAFT_API_KEY:}}
    model: ${MAINTENANCE_ADVISOR_MODEL:${REPORT_DRAFT_MODEL:llama3}}
    timeout: ${MAINTENANCE_ADVISOR_TIMEOUT:60s}
  auth:
    issuer: ${AUTH_JWT_ISSUER:smartdroneinspection}
    audience: ${AUTH_JWT_AUDIENCE:smartdroneinspection-api}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
    jwt-secret: ${AUTH_JWT_SECRET:}
    refresh-token-pepper: ${AUTH_REFRESH_TOKEN_PEPPER:}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1,http://localhost:3002,http://127.0.0.1:3002}
    otp:
      smtp-host: ${AUTH_OTP_SMTP_HOST:}
      enabled: ${AUTH_OTP_ENABLED:true}
      challenge-pepper: ${AUTH_OTP_CHALLENGE_PEPPER:}
      email-from: ${AUTH_OTP_EMAIL_FROM:}
      sms-account-sid: ${TWILIO_ACCOUNT_SID:}
      sms-auth-token: ${TWILIO_AUTH_TOKEN:}
      sms-from-number: ${TWILIO_FROM_NUMBER:}
    google:
      client-id: ${AUTH_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:690876253853-mqm43muduqudn1jbsu292sprrcec100a.apps.googleusercontent.com}}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
      frontend-success-url: ${GOOGLE_FRONTEND_SUCCESS_URL:http://localhost:3000/auth/callback}
      frontend-failure-url: ${GOOGLE_FRONTEND_FAILURE_URL:http://localhost:3000/login}
      mobile-success-url: ${GOOGLE_MOBILE_SUCCESS_URL:smartdrone://auth/callback}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
      email: ${AUTH_BOOTSTRAP_EMAIL:}
      password: ${AUTH_BOOTSTRAP_PASSWORD:}
      full-name: ${AUTH_BOOTSTRAP_FULL_NAME:Admin}
