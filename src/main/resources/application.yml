spring:
  application:
    name: smartdroneinspection
  servlet:
    multipart:
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:10MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:20MB}
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartdroneinspection}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,hikari
  endpoint:
    health:
      show-details: when-authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  payment:
    paypal:
      enabled: ${PAYPAL_ENABLED:false}
      mode: ${PAYPAL_MODE:sandbox}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      return-url: ${PAYPAL_RETURN_URL:http://localhost:3000/subscription?payment=approved}
      cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:3000/subscription?payment=cancelled}
      connect-timeout: ${PAYPAL_CONNECT_TIMEOUT:5s}
      read-timeout: ${PAYPAL_READ_TIMEOUT:20s}
  evidence:
    max-file-size: ${EVIDENCE_MAX_FILE_SIZE:10MB}
  assets:
    drone-document-max-file-size: ${DRONE_DOCUMENT_MAX_FILE_SIZE:10MB}
    document-max-file-size: ${ASSET_DOCUMENT_MAX_FILE_SIZE:10MB}
  workforce:
    # Display warning horizon for a credential approaching its recorded expiry date. Not a
    # statutory renewal rule; change it per deployment if the organization warns earlier or later.
    # Chosen for commercial drone inspection, where operator credentials and liability insurance
    # are annual or longer: two months is enough to arrange renewal and internal review.
    credential-expiring-soon-window: ${CREDENTIAL_EXPIRING_SOON_WINDOW:60d}
  report:
    narrative-max-chars: ${REPORT_NARRATIVE_MAX_CHARS:10000}
  storage:
    minio:
      enabled: ${MINIO_ENABLED:true}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${MINIO_BUCKET:inspection-evidence}
      access-key: ${MINIO_ACCESS_KEY:local_minio_admin}
      secret-key: ${MINIO_SECRET_KEY:local_dev_only_change_me}
  ai:
    yolo:
      enabled: ${YOLO_INFERENCE_ENABLED:false}
      base-url: ${YOLO_INFERENCE_BASE_URL:http://localhost:8000}
      predict-path: ${YOLO_INFERENCE_PREDICT_PATH:/predict}
      connect-timeout: ${YOLO_INFERENCE_CONNECT_TIMEOUT:2s}
      read-timeout: ${YOLO_INFERENCE_READ_TIMEOUT:30s}
    compatible-vision:
      enabled: ${COMPATIBLE_VISION_ENABLED:false}
      base-url: ${COMPATIBLE_VISION_BASE_URL:}
      model: ${COMPATIBLE_VISION_MODEL:}
      api-key: ${COMPATIBLE_VISION_API_KEY:}
      timeout: ${COMPATIBLE_VISION_TIMEOUT:60s}
  report-draft:
    enabled: ${REPORT_DRAFT_ENABLED:false}
    base-url: ${REPORT_DRAFT_BASE_URL:http://localhost:11434}
    api-key: ${REPORT_DRAFT_API_KEY:}
    model: ${REPORT_DRAFT_MODEL:llama3}
    timeout: ${REPORT_DRAFT_TIMEOUT:60s}
  auth:
    issuer: ${AUTH_JWT_ISSUER:smartdroneinspection}
    audience: ${AUTH_JWT_AUDIENCE:smartdroneinspection-api}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
    jwt-secret: ${AUTH_JWT_SECRET:}
    refresh-token-pepper: ${AUTH_REFRESH_TOKEN_PEPPER:}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
      email: ${AUTH_BOOTSTRAP_EMAIL:}
      password: ${AUTH_BOOTSTRAP_PASSWORD:}
      full-name: ${AUTH_BOOTSTRAP_FULL_NAME:Admin}
